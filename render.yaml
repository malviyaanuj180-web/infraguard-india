services:
  - type: web
    name: infraguard-platform
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m sample_data.generate_demo_data
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
